<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="view-transition" content="same-origin">
<title>Aanmelden &amp; Contact | Sonja van der Arend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0,1,600..900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body>

<header class="site-top">
  <div class="header-row">
    <div class="header-left">
      <a class="header-back" href="index.html">&larr; Homepage</a>
      <h1 class="site-name"><a href="over-mij.html">Sonja van der Arend</a></h1>
    </div>
    <a class="nav-cta" href="contact.html">Aanmelden &amp; Contact</a>
  </div>
</header>

<main>
  <div class="page-intro">
    <h2 class="page-title">{{pageTitle}}</h2>
  </div>

  <div class="page-body">
    <p>
      {{intro}}
    </p>

    <form id="contact-form" class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p hidden>
        <label>Laat dit veld leeg: <input name="bot-field"></label>
      </p>
      <div>
        <label for="contact-name">Naam</label>
        <input type="text" id="contact-name" name="name" maxlength="80" required>
      </div>
      <div>
        <label for="contact-email">E-mailadres</label>
        <input type="email" id="contact-email" name="email" maxlength="200" required>
      </div>
      <div>
        <label for="contact-category">Dit gaat over</label>
        <select id="contact-category" name="category" required>
          <option value="" disabled selected>Kies een optie</option>
          <option value="schrijfclub">Schrijfclub</option>
          <option value="school">School</option>
          <option value="organisatie">Organisatie</option>
          <option value="vakgenoten">Vakgenoten</option>
          <option value="overig">Overig</option>
        </select>
      </div>
      <div>
        <label for="contact-text">Bericht</label>
        <textarea id="contact-text" name="text" rows="6" maxlength="2000" required></textarea>
      </div>
      <button type="submit" class="contact-submit">{{submitText}}</button>
      <p id="contact-note" class="contact-note" hidden></p>
    </form>
  </div>
</main>

<footer class="site-bottom">
  <p>Sonja van der Arend werkt onder Stichting Schrijfplezier (facturatie).</p>
  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="login.html">Berichten</a>
    <a href="https://sonjavanderarend.sanity.studio/" target="_blank" rel="noopener">Beheer</a>
  </div>
</footer>

<script src="js/contact.js"></script>
</body>
</html>
