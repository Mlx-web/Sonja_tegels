<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="view-transition" content="same-origin">
<title>Schrijven voor iedereen | Sonja van der Arend</title>
<meta name="description" content="Schrijven voor volwassenen in Wageningen: Schrijfclub Wageningen, vrije inloopsessies en workshops voor groepen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0,1,600..900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body class="page-schrijven-voor-iedereen">

<header class="site-top">
  <div class="header-row">
    <div class="header-left">
      <a class="header-back" href="index.html">&larr; Homepage</a>
      <h1 class="site-name">Sonja van der Arend</h1>
    </div>
    <div class="header-right">
      <a class="header-overmij" href="over-mij.html">Over mij</a>
      <a class="nav-cta" href="contact.html">Aanmelden &amp; Contact</a>
    </div>
  </div>
</header>

<section class="tile-hero tile-hero--schrijven tile-hero--compact">
  <div class="tile-hero-inner">
    <div class="tile-hero-media">
      <span class="pijler">{{pijler}}</span>
      <img class="tile-hero-image" src="images/tegels/schrijven-voor-iedereen.jpg" alt="">
      <span class="sub">{{sub}}</span>
    </div>

    <div class="offer-grid offer-grid--schrijven">
      <div class="offer-card">
        <h3>{{schrijfclub.title}}</h3>
        <p>
          {{schrijfclub.intro}}
        </p>
        <a class="btn-dark" href="{{schrijfclub.linkUrl}}">&rarr; {{schrijfclub.linkText}}</a>
      </div>
      <div class="offer-card">
        <h3>{{workshops.title}}</h3>
        <p>
          {{workshops.intro}}
        </p>
        <p>
          &rarr; <a href="contact.html">{{workshops.linkText}}</a>
        </p>
      </div>
    </div>
  </div>
</section>

<footer class="site-bottom">
  <div class="footer-links">
    <a href="privacy.html">Privacy</a>
    <a href="login.html">Berichten</a>
    <a href="https://sonjavanderarend.sanity.studio/" target="_blank" rel="noopener">Beheer</a>
  </div>
</footer>

</body>
</html>
