<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="view-transition" content="same-origin">
<title>Beheerder inloggen | Sonja van der Arend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,SOFT,WONK,wght@9..144,0,1,600..900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/homepage.css">
</head>
<body>

<header class="site-top">
  <div class="header-row">
    <h1 class="site-name"><a href="over-mij.html">Sonja van der Arend</a></h1>
    <a class="nav-cta" href="contact.html">Aanmelden &amp; Contact</a>
  </div>
</header>

<main class="auth-main">
  <a class="back-link" href="index.html">&larr; Terug naar de homepage</a>

  <div class="auth-panel">
    <h2>Beheerder inloggen</h2>
    <p>Log in om binnengekomen contactaanvragen te bekijken.</p>

    <form id="login-form">
      <div class="field">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Inloggen</button>
      <p id="login-message" class="message error" hidden></p>
    </form>
  </div>
</main>

<footer class="site-bottom">
  <p>
    Sonja van der Arend werkt onder Stichting Schrijfplezier (facturatie).
  </p>
</footer>

<script src="js/login.js"></script>
</body>
</html>
